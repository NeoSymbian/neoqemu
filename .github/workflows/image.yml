name: image

# Builds QEMU (qemu/, aarch64-softmmu) with the virt run tools, runs the image's checks, and publishes
# ghcr.io/neosymbian/neoqemu:
#   push to main   -> :latest + :sha-<short>
#   tag vX.Y.Z     -> :X.Y.Z + :latest + :sha-<short>
#   pull request   -> build and checks only
# NeoSymbian/build's toolchain image pins it by digest (docker/toolchain/Dockerfile).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['qemu/**', 'tools/**', 'container/**', '.dockerignore', '.github/workflows/image.yml']
  pull_request:
    paths: ['qemu/**', 'tools/**', 'container/**', '.dockerignore', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        run: docker build -f container/Dockerfile -t neosymbian/neoqemu:ci .
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags="latest sha-${GITHUB_SHA::7}"
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags ${GITHUB_REF#refs/tags/v}" ;; esac
          for t in $tags; do
            docker tag neosymbian/neoqemu:ci "ghcr.io/neosymbian/neoqemu:$t"
            docker push "ghcr.io/neosymbian/neoqemu:$t"
          done
          docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/neosymbian/neoqemu:latest"
